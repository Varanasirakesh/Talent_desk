<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiring settings · Talent Desk</title><link rel="stylesheet" href="/static/talent-desk.css"><script defer src="https://unpkg.com/htmx.org@2.0.4"></script></head><body><header><a href="/">Talent Desk</a><span>Hiring settings</span></header><main><section class="hero"><p class="kicker">RECRUITER PREFERENCES</p><h1>Hiring settings</h1><p>These defaults are stored for this Talent Desk workspace.</p></section><section class="surface">{% if saved %}<p role="status">{% if imported %}Settings imported and saved.{% else %}Settings saved.{% endif %}</p>{% endif %}<form class="job-form" method="post"><div class="two-col"><label>Your name<input name="recruiter_name" value="{{ settings.recruiter_name }}"></label><label>Company<input name="company" value="{{ settings.company }}"></label><label>Default role<input name="default_role" value="{{ settings.default_role }}"></label><label>Preferred location<input name="default_location" value="{{ settings.default_location }}"></label><label>Minimum experience · years<input name="min_experience_years" type="number" min="0" step=".5" value="{{ settings.min_experience_years or '' }}"></label><label>Maximum notice period · days<input name="max_notice_days" type="number" min="0" value="{{ settings.max_notice_days or '' }}"></label><label>Maximum salary · ₹ LPA<input name="max_salary_lpa" type="number" min="0" step=".1" value="{{ settings.max_salary_lpa or '' }}"></label><label>LinkedIn profile URL (optional)<input name="linkedin_profile_url" type="url" value="{{ settings.linkedin_profile_url }}"></label></div><label>Default skills / keywords<input name="default_skills" value="{{ settings.default_skills|join(', ') }}" placeholder="Python, SQL, Airflow"></label><button>Save settings</button></form><hr><div class="section-head"><a class="button-link" href="/settings/export.json">Export settings JSON</a><form enctype="multipart/form-data" hx-encoding="multipart/form-data" hx-post="/settings/import" hx-target="body" hx-swap="outerHTML"><label>Import settings JSON<input type="file" name="settings_file" accept=".json,application/json" required></label><button>Import</button></form></div></section></main></body></html>
