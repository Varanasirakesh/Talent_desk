{% if tasks %}<ul class="task-list">{% for task in tasks %}<li><button class="check" hx-patch="/jobs/{{ job_id }}/tasks/{{ task.id }}" hx-target="#tasks">{{ '✓' if task.status == 'done' else '○' }}</button><span class="{{ 'done' if task.status == 'done' else '' }}"><strong>{{ task.title }}</strong> · {{ task.owner }} · {{ task.due_date or 'No due date' }}</span></li>{% endfor %}</ul>{% else %}<p>No onboarding tasks yet.</p>{% endif %}
