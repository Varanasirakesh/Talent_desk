{% if jobs %}<div class="job-list">{% for job in jobs %}<article class="job-card"><a class="job-link" href="/jobs/{{ job.id }}"><strong>{{ job.id }}</strong><h3>{{ job.title }}</h3><p>{{ job.location or "Location not set" }}</p></a><button class="danger" hx-delete="/ui/jobs/{{ job.id }}" hx-target="#jobs" hx-swap="innerHTML" hx-confirm="Delete {{ job.id }} and all of its candidates, scores, shortlist entries, and onboarding tasks?">Delete job</button></article>{% endfor %}</div>{% else %}<p>No saved requisitions yet. Add one to begin.</p>{% endif %}
