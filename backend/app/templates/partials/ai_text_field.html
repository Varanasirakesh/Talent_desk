<div id="{{ field_id }}">
  {% if input %}
  <input id="job-keywords" name="{{ name }}" value="{{ value }}" placeholder="Python, SQL, Airflow">
  {% else %}
  <textarea id="job-description" name="{{ name }}" required>{{ value }}</textarea>
  {% endif %}
  {% if message %}<p class="field-message {% if is_error %}error-message{% else %}success-message{% endif %}" role="{% if is_error %}alert{% else %}status{% endif %}">{{ message }}</p>{% endif %}
</div>
