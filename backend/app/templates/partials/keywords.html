<div class="tags">{% for keyword in job.keywords if keyword.is_approved %}<span class="tag">{{ keyword.term }} <small>({{ keyword.source }})</small> <button class="tag-remove" hx-delete="/jobs/{{ job.id }}/keywords/{{ keyword.id }}" hx-target="#keywords" title="Remove {{ keyword.term }}">×</button></span>{% else %}<p>No keywords yet.</p>{% endfor %}</div>
